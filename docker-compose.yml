services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ftmt_db
      POSTGRES_USER: ftmt_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftmt_user -d ftmt_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ftmt_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/ftmt_db
      SEED_DEMO_DATA: "false"
    depends_on:
      db:
        condition: service_healthy
    command: python -m alembic upgrade head
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ftmt_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/ftmt_db
      SEED_DEMO_DATA: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: python -m app.main

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ftmt_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/ftmt_db
      SEED_DEMO_DATA: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    command: uvicorn app.admin.app:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
