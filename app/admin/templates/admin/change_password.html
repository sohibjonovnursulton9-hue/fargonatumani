{% extends "admin/base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; text-align: center;">
    <h3 style="color:red;">Xavfsizlik talabi: yangi parol o'rnating</h3>
    <p>Sizga vaqtinchalik parol berilgan. Tizimdan foydalanishdan oldin o'zingizcha kuchli parol o'rnating.</p>

    <form method="POST" action="/admin/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div style="margin-bottom: 15px; text-align: left;">
            <label>Yangi parol (kamida 12 belgi):</label><br>
            <input type="password" name="new_password" minlength="12" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px; text-align: left;">
            <label>Parolni tasdiqlang:</label><br>
            <input type="password" name="confirm_password" minlength="12" required style="width: 100%; padding: 8px;">
        </div>

        <button type="submit" style="padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer;">
            Parolni o'zgartirish
        </button>
    </form>
</div>
{% endblock %}
